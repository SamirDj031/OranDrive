<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORAN DRIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071526;color:white;font-family:Arial;text-align:center;overflow:hidden}
header{padding:12px;background:#102b43;font-size:24px;font-weight:bold;color:#ffd34e}
#info{display:flex;justify-content:space-around;padding:10px;font-size:18px}
canvas{display:block;margin:auto;background:#318b54;width:100%;max-width:480px;height:65vh;touch-action:none}
.controls{display:flex;justify-content:space-around;padding:12px}
button{border:0;border-radius:15px;padding:16px 25px;font-size:20px;font-weight:bold;background:#ffd34e;color:#102035}
#msg{position:absolute;top:40%;width:100%;font-size:24px;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none}
</style>
</head>
<body>
<header>🏁 ORAN DRIVE</header>
<div id="info">
<span>النقاط: <b id="score">0</b></span>
<span>🪙 العملات: <b id="coins">0</b></span>
</div>
<canvas id="game" width="360" height="520"></canvas>
<div id="msg">اضغط ابدأ للعب!</div>
<div class="controls">
<button id="left">⬅️</button>
<button id="start">▶ ابدأ</button>
<button id="right">➡️</button>
</div>
<script>
const c=document.getElementById("game"),x=c.getContext("2d");
let player=160, cars=[], money=[], score=0, coins=0, speed=3, running=false, over=false, frame=0;
const road={left:45,right:315};
function car(px,py,color){x.fillStyle=color;x.fillRect(px,py,38,65);x.fillStyle="#bdefff";x.fillRect(px+6,py+8,26,15);x.fillStyle="#222";x.fillRect(px-4,py+10,5,15);x.fillRect(px+37,py+10,5,15);x.fillRect(px-4,py+43,5,15);x.fillRect(px+37,py+43,5,15)}
function draw(){
x.clearRect(0,0,360,520);
x.fillStyle="#318b54";x.fillRect(0,0,360,520);
x.fillStyle="#444";x.fillRect(road.left,0,270,520);
x.fillStyle="#fff";x.fillRect(road.left,0,5,520);x.fillRect(road.right-5,0,5,520);
x.fillStyle="#eee";
for(let y=(frame*speed%70)-70;y<520;y+=70)x.fillRect(176,y,8,38);
car(player,430,"#16aaff");
cars.forEach(a=>car(a.x,a.y,a.color));
money.forEach(m=>{x.fillStyle="#ffd700";x.beginPath();x.arc(m.x,m.y,10,0,Math.PI*2);x.fill();x.fillStyle="#9b6800";x.font="bold 13px Arial";x.fillText("$",m.x-4,m.y+5)});
}
function reset(){player=160;cars=[];money=[];score=0;coins=0;speed=3;frame=0;over=false;running=true;document.getElementById("msg").style.display="none";update()}
function update(){document.getElementById("score").textContent=score;document.getElementById("coins").textContent=coins}
function loop(){
if(!running)return;
frame++;
if(frame%55===0)cars.push({x:55+Math.random()*230,y:-70,color:["#ef4444","#f5f5f5","#ff8c24"][Math.floor(Math.random()*3)]});
if(frame%95===0)money.push({x:65+Math.random()*220,y:-20});
cars.forEach(a=>a.y+=speed);
money.forEach(m=>m.y+=speed);
cars=cars.filter(a=>a.y<550);money=money.filter(m=>m.y<550);
for(const a of cars){if(a.x<player+35&&a.x+38>player&&a.y<495&&a.y+65>430){running=false;over=true;document.getElementById("msg").innerHTML="💥 انتهت اللعبة!<br>نقاطك: "+score+"<br>اضغط إعادة اللعب";document.getElementById("msg").style.display="block";document.getElementById("start").textContent="🔄 إعادة";return}}
money=money.filter(m=>{if(Math.abs(m.x-(player+19))<30&&Math.abs(m.y-460)<40){coins++;return false}return true});
score++;if(score%500===0)speed+=0.4;update();draw();requestAnimationFrame(loop)
}
function move(d){player=Math.max(50,Math.min(270,player+d));if(running)draw()}
document.getElementById("left").onpointerdown=()=>move(-35);
document.getElementById("right").onpointerdown=()=>move(35);
document.getElementById("start").onclick=()=>{if(!running){reset();draw();loop()}};
c.addEventListener("touchstart",e=>{if(!running)return;let r=c.getBoundingClientRect();let px=e.touches[0].clientX-r.left;if(px<r.width/2)move(-35);else move(35)},{passive:true});
draw();
</script>
</body>
</html>
